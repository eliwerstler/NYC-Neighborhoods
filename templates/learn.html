{% extends "base.html" %}
{% block title %}Learn NYC Neighborhoods{% endblock %}

{% block content %}
<div class="quiz-layout">

  <div class="quiz-sidebar" style="flex: 0 0 380px; justify-content: flex-start; overflow: hidden;">
    <div id="sidebar-content" style="flex: 1; overflow-y: auto; min-height: 0;"></div>
    <div id="nav-buttons" style="flex-shrink: 0; padding-top: 1rem; border-top: 1px solid var(--border);"></div>
  </div>

  <div class="quiz-map-col" id="map-container"></div>

</div>
{% endblock %}

{% block scripts %}
<script>
window.PAGE_SHORTCUTS = [
  { key: "→", desc: "Next zone" },
  { key: "←", desc: "Previous zone" },
];
</script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
(function () {
  const allZones = {{ zones | tojson }};
  const NUM_ZONES = {{ num_zones }};
  const FROM_QUIZ = {{ from_quiz | tojson }};
  let currentZone = {{ start_zone - 1 }};
  let quizPaths = null;
  let labels = null;
  let mapReady = false;

  // ── Sidebar ────────────────────────────────────────────
  function renderSidebar(idx, animate) {
    const zone = allZones[idx];
    const content = document.getElementById("sidebar-content");
    const nav = document.getElementById("nav-buttons");

    function doUpdate() {
      content.innerHTML =
        `<p class="step-label">Zone ${idx + 1} of ${NUM_ZONES}</p>
         <div class="progress mb-3" style="height:6px;">
           <div class="progress-bar" style="width:${Math.round((idx+1)/NUM_ZONES*100)}%;background:var(--navy);"></div>
         </div>
         <div class="zone-band" style="background:${zone.color};"></div>
         <h1 class="mb-0">${zone.name}</h1>
         <p class="text-muted mb-4" style="font-size:0.9rem;">${zone.street_range}</p>
         ${zone.neighborhoods.map(n =>
           `<div class="hood-card"><h5>${n.name}</h5><p>${n.fact}</p></div>`
         ).join("")}`;

      const backBtn = idx === 0
        ? `<a href="/" class="btn btn-outline-secondary">← Back<kbd>←</kbd></a>`
        : `<button class="btn btn-outline-secondary" onclick="goZone(${idx-1})">← Back<kbd>←</kbd></button>`;
      const nextBtn = idx === NUM_ZONES - 1
        ? `<a href="/quiz" class="btn btn-primary">Start Quiz →<kbd>→</kbd></a>`
        : `<button class="btn btn-primary" onclick="goZone(${idx+1})">Next →<kbd>→</kbd></button>`;

      const backToQuiz = FROM_QUIZ
        ? `<a href="/quiz" class="btn btn-outline-secondary w-100 mt-2" style="margin-top:0.5rem!important;">Back to Quiz →</a>`
        : '';

      nav.innerHTML = `<div class="d-flex gap-2">${backBtn} ${nextBtn}</div>${backToQuiz}`;

      if (animate) {
        content.style.opacity = "1";
        nav.style.opacity = "1";
      }
    }

    if (animate) {
      content.style.transition = "opacity 0.15s";
      nav.style.transition = "opacity 0.15s";
      content.style.opacity = "0";
      nav.style.opacity = "0";
      setTimeout(doUpdate, 150);
    } else {
      doUpdate();
    }
  }

  // ── Map highlight ──────────────────────────────────────
  function updateMap(idx) {
    if (!mapReady) return;
    const zone = allZones[idx];
    quizPaths.transition().duration(250)
      .attr("fill", d => d.properties.zone === idx + 1 ? zone.color : "#D1CBC0")
      .attr("stroke-width", d => d.properties.zone === idx + 1 ? 1.5 : 0.4);
    labels.transition().duration(200)
      .style("opacity", d => d.properties.zone === idx + 1 ? 1 : 0);
  }

  window.goZone = function (idx) {
    currentZone = idx;
    renderSidebar(idx, true);
    updateMap(idx);
  };

  // ── Init sidebar ───────────────────────────────────────
  renderSidebar(currentZone, false);

  // ── Map ────────────────────────────────────────────────
  const container = document.getElementById("map-container");
  const W = container.clientWidth;
  const H = container.clientHeight;

  const svg = d3.select("#map-container")
    .append("svg")
    .attr("viewBox", `0 0 ${W} ${H}`)
    .attr("preserveAspectRatio", "xMidYMid meet")
    .style("width", "100%")
    .style("height", "100%");

  svg.append("rect").attr("width", W).attr("height", H).attr("fill", "#C9DDE8");

  d3.json("/static/neighborhoods.geojson").then(function (geo) {
    const projection = d3.geoMercator().fitSize([W, H], geo);
    const pathGen = d3.geoPath().projection(projection);

    svg.selectAll(".bg-path")
      .data(geo.features.filter(d => !d.properties.quiz))
      .join("path").attr("d", pathGen).attr("class", "bg-path");

    quizPaths = svg.selectAll(".zone-hood")
      .data(geo.features.filter(d => d.properties.quiz))
      .join("path")
      .attr("d", pathGen)
      .attr("fill", d => d.properties.zone === currentZone + 1 ? allZones[currentZone].color : "#D1CBC0")
      .attr("stroke", "#fff")
      .attr("stroke-width", d => d.properties.zone === currentZone + 1 ? 1.5 : 0.4)
      .style("pointer-events", "none");

    const labelLayer = svg.append("g");
    labels = labelLayer.selectAll("text")
      .data(geo.features.filter(d => d.properties.quiz))
      .join("text")
      .attr("x", d => pathGen.centroid(d)[0])
      .attr("y", d => pathGen.centroid(d)[1])
      .attr("text-anchor", "middle")
      .attr("dominant-baseline", "middle")
      .style("pointer-events", "none")
      .style("font-family", "'Inter', sans-serif")
      .style("font-size", "11px")
      .style("font-weight", "600")
      .style("fill", "#fff")
      .style("text-shadow", "0 1px 2px rgba(0,0,0,0.4)")
      .style("opacity", d => d.properties.zone === currentZone + 1 ? 1 : 0)
      .text(d => d.properties.name);

    mapReady = true;
  });

  // ── Keyboard shortcuts ──────────────────────────────
  document.addEventListener("keydown", e => {
    if (e.target.matches("button, a, input, textarea")) return;
    if (e.key === "ArrowRight") {
      if (currentZone < NUM_ZONES - 1) goZone(currentZone + 1);
      else window.location.href = "/quiz";
    } else if (e.key === "ArrowLeft") {
      if (currentZone > 0) goZone(currentZone - 1);
      else window.location.href = "/";
    }
  });
}());
</script>
{% endblock %}
