{% extends "base.html" %}
{% block title %}Quiz{% endblock %}

{% block content %}
<div class="quiz-layout">

  <div class="quiz-sidebar">
    <div>
      <div id="sidebar-content"></div>
      <p id="feedback" class="mt-3 mb-0" style="font-size:0.9rem;min-height:1.4em;font-weight:600;"></p>
    </div>
  </div>

  <div class="quiz-map-col" id="map-container"></div>

</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
(function () {
  const allQuestions = {{ questions | tojson }};
  const questionZones = {{ question_zones | tojson }};
  const NUM_QUESTIONS = {{ num_questions }};
  const correctNames = {{ correct_names | tojson }};
  const correctSet = new Set(correctNames);
  let currentQ = {{ starting_q }};
  let streak = 0;
  const feedback = document.getElementById("feedback");

  // ── Sidebar ────────────────────────────────────────────
  function renderSidebar(idx, animate) {
    const content = document.getElementById("sidebar-content");

    function doUpdate() {
      content.innerHTML =
        `<p class="step-label">Question ${idx + 1} of ${NUM_QUESTIONS}</p>
         <div class="progress mb-3" style="height:6px;">
           <div class="progress-bar" style="width:${Math.round((idx+1)/NUM_QUESTIONS*100)}%;background:var(--navy);"></div>
         </div>
         <p class="step-label mb-4">Streak &nbsp;<span style="color:var(--navy);font-size:1rem;font-weight:700;">${streak}</span></p>
         <p class="text-muted mb-1" style="font-size:0.85rem;">Tap the neighborhood on the map</p>
         <h1 class="mb-0" style="font-size:2.2rem;">${allQuestions[idx]}</h1>`;
      if (animate) content.style.opacity = "1";
    }

    if (animate) {
      content.style.transition = "opacity 0.15s";
      content.style.opacity = "0";
      setTimeout(doUpdate, 150);
    } else {
      doUpdate();
    }
  }

  renderSidebar(currentQ, false);

  // ── Map ────────────────────────────────────────────────
  const container = document.getElementById("map-container");
  const W = container.clientWidth;
  const H = container.clientHeight;

  const svg = d3.select("#map-container")
    .append("svg")
    .attr("viewBox", `0 0 ${W} ${H}`)
    .attr("preserveAspectRatio", "xMidYMid meet")
    .style("width", "100%")
    .style("height", "100%");

  svg.append("rect").attr("width", W).attr("height", H).attr("fill", "#C9DDE8");

  d3.json("/static/neighborhoods.geojson").then(function (geo) {
    const projection = d3.geoMercator().fitSize([W, H], geo);
    const pathGen = d3.geoPath().projection(projection);

    svg.selectAll(".bg-path")
      .data(geo.features.filter(d => !d.properties.quiz))
      .join("path").attr("d", pathGen).attr("class", "bg-path");

    const paths = svg.selectAll(".quiz-hood")
      .data(geo.features.filter(d => d.properties.quiz))
      .join("path")
      .attr("d", pathGen)
      .attr("class", d => correctSet.has(d.properties.name) ? "hood-correct" : "hood-path")
      .attr("data-name", d => d.properties.name);

    let busy = false;
    let localWrong = 0;

    function advance() {
      currentQ++;
      localWrong = 0;
      if (currentQ >= NUM_QUESTIONS) {
        window.location.href = "/results";
      } else {
        feedback.textContent = "";
        renderSidebar(currentQ, true);
        busy = false;
      }
    }

    paths.on("click", function (event, d) {
      if (busy) return;
      const el = d3.select(this);
      if (el.attr("class") !== "hood-path") return;
      busy = true;

      fetch("/quiz/check", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ q_index: currentQ, answer: d.properties.name })
      })
      .then(r => r.json())
      .then(result => {
        if (result.correct) {
          const needsRetry = localWrong > 0;
          if (needsRetry) { streak = 0; } else { streak++; }
          el.attr("class", needsRetry ? "hood-yellow" : "hood-correct");
          correctSet.add(d.properties.name);
          feedback.style.color = needsRetry ? "#92610A" : "var(--success)";
          feedback.textContent = "Correct!";
          setTimeout(advance, 700);

        } else if (localWrong === 0) {
          // First wrong — red flash, one more chance
          localWrong = 1;
          streak = 0;
          el.attr("class", "hood-wrong");
          feedback.style.color = "var(--danger)";
          feedback.textContent = "Try again!";
          setTimeout(() => {
            el.attr("class", "hood-path");
            feedback.textContent = "";
            busy = false;
          }, 700);

        } else {
          // Second wrong — reveal correct neighborhood in red, move on
          paths.filter(d => d.properties.name === allQuestions[currentQ])
            .attr("class", "hood-wrong");
          feedback.style.color = "var(--danger)";
          feedback.textContent = "Wrong — moving on";
          setTimeout(advance, 1000);
        }
      });
    });
  });
}());
</script>
{% endblock %}
