<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NYC Neighborhoods{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <button class="shortcuts-btn" id="shortcuts-btn" title="Keyboard shortcuts">?</button>
  <div class="shortcuts-panel" id="shortcuts-panel" style="display:none;"></div>

  {% block content %}{% endblock %}
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
  <script>
  (function () {
    const btn   = document.getElementById("shortcuts-btn");
    const panel = document.getElementById("shortcuts-panel");
    const defs  = window.PAGE_SHORTCUTS || [];
    if (!defs.length) { btn.style.display = "none"; return; }

    function build() {
      panel.innerHTML =
        `<div class="shortcuts-panel-header">Keyboard shortcuts</div>` +
        defs.map(s => `<div class="shortcuts-row"><kbd>${s.key}</kbd><span class="shortcuts-row-desc">${s.desc}</span></div>`).join("") +
        `<div class="shortcuts-row"><kbd>?</kbd><span class="shortcuts-row-desc">Toggle this panel</span></div>`;
    }

    function open()   { build(); panel.style.display = "block"; btn.classList.add("open"); }
    function close()  { panel.style.display = "none";  btn.classList.remove("open"); }
    function toggle() { panel.style.display === "none" ? open() : close(); }

    btn.addEventListener("click", e => { e.stopPropagation(); toggle(); });
    document.addEventListener("click", e => { if (!panel.contains(e.target) && e.target !== btn) close(); });
    document.addEventListener("keydown", e => {
      if (e.target.matches("input, textarea")) return;
      if (e.key === "?") { e.preventDefault(); toggle(); }
      else if (e.key === "Escape" && panel.style.display !== "none") close();
    });
  }());
  </script>
</body>
</html>
